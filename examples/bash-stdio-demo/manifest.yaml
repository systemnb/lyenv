name: bash-stdio-demo
version: 0.1.0
expose: [shdemo]

config:
  local_file: ./config.yaml

commands:
  - name: configure
    summary: "Configure via Bash stdio (one-liner mutations)"
    executor: stdio
    program: ./configure.sh
    use_stdio: true
    workdir: .

  - name: hello
    summary: "Say hello via shell"
    executor: shell
    program: echo "hello from shell"
    workdir: .
