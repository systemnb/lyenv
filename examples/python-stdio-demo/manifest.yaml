name: python-stdio-demo
version: 0.1.0
expose: [pydemo]

config:
  local_file: ./config.yaml

commands:
  - name: configure
    summary: "Configure via Python stdio (one-liner mutations)"
    executor: stdio
    program: ./scripts/configure.py
    use_stdio: true
    workdir: .

  - name: hello
    summary: "Say hello via shell"
    executor: shell
    program: echo "hello from shell"
    workdir: .
